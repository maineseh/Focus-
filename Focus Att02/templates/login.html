<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="view-transition" content="same-origin">
<title>Login | Focus OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
    <script src="{{ url_for('static', filename='js/accessibility.js') }}"></script>
    <script src="{{ url_for('static', filename='js/soundtrack.js') }}"></script>
</head>
<body>
    <script>(function(){var t=localStorage.getItem('focus_theme');if(t&&t!=='default')document.body.classList.add(t+'-theme');})();</script>
    <script>try{localStorage.removeItem('focus_ultimo_estudos');localStorage.removeItem('focus_ultimo_comunidades');}catch(e){}</script>
<script>
(function () {
    const theme = localStorage.getItem('focus_theme') || 'default';
    if (theme !== 'default') document.body.classList.add(theme + '-theme');
})();
</script>

<div class="login-card">
    <header class="header-login">
        <img src="{{ url_for('static', filename='img/cat.png') }}" class="logo-icon" alt="Logo Focus">
        <h2>Focus</h2>
        <p>Acesse seu painel operacional</p>
    </header>

    {% if erro %}
        <div class="erro">
            <i class="fa-solid fa-triangle-exclamation"></i> {{ erro }}
        </div>
    {% endif %}

    <form method="POST">
        <div class="input-group">
            <label>Identificação</label>
            <i class="fa-regular fa-user icon-field"></i>
            <input type="text" name="login" placeholder="E-mail ou Usuário" required autocomplete="off">
        </div>

        <div class="input-group">
            <label>Chave de Acesso</label>
            <i class="fa-solid fa-lock icon-field"></i>
            <input type="password" name="senha" id="senha" placeholder="Sua senha" required>
            <button type="button" class="eye-btn" onclick="toggleSenha('senha','eye-icon')">
                <i class="fa-regular fa-eye-slash" id="eye-icon"></i>
            </button>
        </div>

        <div class="options">
            <label><input type="checkbox" name="lembrar"> Manter conectado</label>
            <a href="{{ url_for('esqueceu_senha') }}" class="link-esqueceu">Esqueceu a senha?</a>
        </div>

        <button type="submit" class="btn">
            <i class="fa-solid fa-arrow-right-to-bracket"></i> Autenticar
        </button>
    </form>

    <div class="divider">Novo por aqui?</div>

    <a href="{{ url_for('cadastro') }}" style="text-decoration:none;">
        <button class="btn-outline" type="button">
            <i class="fa-solid fa-user-plus"></i> Criar Nova Conta
        </button>
    </a>
</div>

<script>

function toggleSenha(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    }
}

</script>

</body>
</html>
