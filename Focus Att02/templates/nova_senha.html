<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta name="view-transition" content="same-origin">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova Senha | Focus OS</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/nova_senha.css') }}">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/accessibility.css') }}">
    <script src="{{ url_for('static', filename='js/accessibility.js') }}"></script>
    <script src="{{ url_for('static', filename='js/soundtrack.js') }}"></script>
</head>
<body>
    <script>(function(){var t=localStorage.getItem('focus_theme');if(t&&t!=='default')document.body.classList.add(t+'-theme');})();</script>
<script>
(function () {
    const theme = localStorage.getItem('focus_theme') || 'default';
    if (theme !== 'default') document.body.classList.add(theme + '-theme');
})();
</script>

<div class="card">
    {% if not token_valido %}
        <div class="header-nova">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <h2>Link Inválido</h2>
            <p class="subtitle">{{ erro }}</p>
        </div>

        <a href="{{ url_for('esqueceu_senha') }}" style="text-decoration:none;">
            <button type="button" class="btn">Solicitar Novo Link</button>
        </a>

    {% else %}
        <div class="header-nova">
            <i class="fa-solid fa-key"></i>
            <h2>Nova Senha</h2>
            <p class="subtitle">Digite sua nova senha de acesso.</p>
        </div>

        {% if erro %}
            <div class="erro"><i class="fa-solid fa-circle-exclamation"></i> {{ erro }}</div>
        {% endif %}

        <form method="POST" action="{{ url_for('nova_senha', token=token_url) }}">
            <div class="input-group">
                <i class="fa-solid fa-lock icon-field"></i>
                <input type="password" name="senha" id="senha_nova" placeholder="Nova senha" required>
                <button type="button" class="eye-btn" onclick="toggleSenha('senha_nova', 'eye-nova')">
                    <i class="fa-regular fa-eye-slash" id="eye-nova"></i>
                </button>
            </div>
            <div class="input-group">
                <i class="fa-solid fa-lock icon-field"></i>
                <input type="password" name="confirma_senha" id="confirma_nova" placeholder="Confirme a nova senha" required>
                <button type="button" class="eye-btn" onclick="toggleSenha('confirma_nova', 'eye-confirma-nova')">
                    <i class="fa-regular fa-eye-slash" id="eye-confirma-nova"></i>
                </button>
            </div>
            <button type="submit" class="btn">Salvar Nova Senha</button>
        </form>

        <a href="{{ url_for('login') }}" class="btn-voltar">
            <i class="fa-solid fa-xmark"></i> Cancelar
        </a>
    {% endif %}
</div>

<script>
function toggleSenha(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (input.type === "password") {
        input.type = "text";
        icon.classList.replace("fa-eye-slash", "fa-eye");
    } else {
        input.type = "password";
        icon.classList.replace("fa-eye", "fa-eye-slash");
    }
}
</script>
</body>
</html>
